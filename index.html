<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ignite - Histórias que Mudam o Jogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* Fundo WhatsApp mantido */
            --bg-body: #E5DDD5; 
            
            --accent-red: #E50914; 
            --accent-hover: #ff1f2a;
            
            --text-main: #111111; 
            --text-light: #4a555c; 
            --radius-lg: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
        }

        /* --- CABEÇALHO FLUTUANTE (Sem fundo, com sombra) --- */
        header {
            padding: 20px;
            text-align: center;
            background: transparent; /* Fundo removido */
            flex-shrink: 0; 
        }
        .logo { 
            font-weight: 800; 
            letter-spacing: -1px; 
            font-size: 1.5rem; 
            text-transform: uppercase; 
            color: #111111; 
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.12); /* Sombra discreta e elegante */
        }
        .logo span { 
            color: var(--accent-red); 
            font-weight: 800; 
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 20px 40px 20px;
        }

        .screen {
            width: 100%;
            max-width: 420px;
            text-align: center;
            margin: auto; 
        }

        /* --- CONTEÚDO DINÂMICO --- */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(229, 9, 20, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(229, 9, 20, 0.3);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        h1 { font-size: 1.5rem; margin-bottom: 12px; line-height: 1.3; font-weight: 800; }
        
        /* Citação: Fonte mais fina e em itálico */
        .desc { 
            color: var(--text-light); 
            margin-bottom: 30px; 
            font-size: 1.05rem; 
            line-height: 1.5; 
            font-weight: 300; /* Fonte fina */
            font-style: italic; /* Itálico */
            padding: 0 10px;
        }

        /* --- VISUALIZADOR --- */
        .visualizer {
            width: 160px;
            height: 160px;
            background: #FFFFFF;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .visualizer.playing {
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 0 40px rgba(229, 9, 20, 0.15);
        }

        .visualizer::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--accent-red);
            border-radius: 50%;
            opacity: 0;
        }

        .visualizer.playing::before {
            animation: pulse-red 1.5s infinite ease-out;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Ondas de Áudio */
        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 60px;
        }
        
        .bar {
            width: 8px;
            border-radius: 4px;
            background: var(--accent-red);
            height: 20%;
            transition: height 0.2s ease;
        }

        .bar:nth-child(1) { height: 40%; }
        .bar:nth-child(2) { height: 80%; }
        .bar:nth-child(3) { height: 100%; }
        .bar:nth-child(4) { height: 60%; }
        .bar:nth-child(5) { height: 50%; }

        .visualizer.playing .bar { animation: bounce 1s infinite alternate ease-in-out; }
        .visualizer.playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .visualizer.playing .bar:nth-child(2) { animation-delay: 0.3s; }
        .visualizer.playing .bar:nth-child(3) { animation-delay: 0.0s; }
        .visualizer.playing .bar:nth-child(4) { animation-delay: 0.4s; }
        .visualizer.playing .bar:nth-child(5) { animation-delay: 0.2s; }

        @keyframes bounce {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        /* --- PLAYER CONTROLS (Efeito Glass/Vidro sem cinza) --- */
        .player-controls {
            background: rgba(255, 255, 255, 0.15); /* Branco bem transparente */
            backdrop-filter: blur(16px); /* Desfoque forte do fundo */
            -webkit-backdrop-filter: blur(16px); 
            padding: 25px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.4); /* Borda fina clara (reflexo do vidro) */
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); /* Sombra elegante flutuante */
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.08); /* Fundo da barra */
            border-radius: 3px;
            margin-bottom: 15px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-red);
            border-radius: 3px;
            position: relative;
            transition: width 0.1s linear;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #222;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .play-btn {
            width: 65px;
            height: 65px;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.2);
        }
        .play-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
        .play-btn:active { transform: scale(0.95); }

        /* --- BOTÃO DE COMPARTILHAMENTO --- */
        .cta-container {
            display: none; 
            animation: slideUp 0.5s ease forwards;
            margin-top: 15px;
        }

        .cta-container.show {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-share {
            display: block;
            width: 100%;
            padding: 16px;
            background: #25D366; 
            color: #111;
            border: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
        }
        .btn-share i { margin-right: 8px; font-size: 1.2rem; }
        .btn-share:hover { background: #20b858; transform: translateY(-2px); }
        .btn-share:active { transform: scale(0.98); }

        footer { padding: 20px; text-align: center; font-size: 0.7rem; color: #778890; flex-shrink: 0; }

    </style>
</head>
<body>

    <header>
        <div class="logo">IGNITE<span>.</span></div>
    </header>

    <main class="app-container">
        
        <section id="experience-screen" class="screen">
            
            <span class="badge" id="dom-season">Carregando...</span>
            <h1 id="dom-episode">...</h1>
            <p class="desc" id="dom-context">...</p>

            <div class="visualizer" id="visualizer-wrapper">
                <div class="waveform">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <div class="player-controls">
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="time-info">
                    <span id="current-time">00:00</span>
                    <span id="total-time">00:00</span>
                </div>
                <button class="play-btn" id="play-pause">
                    <i class="fas fa-play" id="play-icon" style="margin-left: 5px;"></i>
                </button>
            </div>

            <!-- Botão CTA -->
            <div id="cta-container" class="cta-container">
                <button id="dom-share-link" class="btn-share">
                    <i class="fab fa-whatsapp" id="share-icon"></i> <span id="share-text">Compartilhar Inspiração</span>
                </button>
            </div>

        </section>

    </main>

    <footer>
        &copy; 2026 Ignite. Histórias de Alto Impacto.
    </footer>

    <script>
        // ==========================================
        // ÁREA DE EDIÇÃO DIÁRIA (Altere os valores aqui)
        // ==========================================
        const CONTEUDO_DIARIO = {
            temporada: "Temporada 1: Lendas do Esporte",
            episodio: "Ep 01: A Obsessão de Kobe Bryant",
            
            // Note que eu adicionei aspas ( " ) no começo e no fim do contexto para ficar com cara de citação!
            contexto: '"A dor de hoje é a vitória de amanhã. Descubra como uma decisão tomada às 4h da manhã forjou a mentalidade de um dos maiores atletas da história."',
            
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", 
            linkParaCopiar: "https://seu-link-ignite.com/kobe-bryant-ep01"
        };
        // ==========================================
        // FIM DA ÁREA DE EDIÇÃO DIÁRIA
        // ==========================================

        document.getElementById('dom-season').innerText = CONTEUDO_DIARIO.temporada;
        document.getElementById('dom-episode').innerText = CONTEUDO_DIARIO.episodio;
        document.getElementById('dom-context').innerText = CONTEUDO_DIARIO.contexto;

        const audio = new Audio(CONTEUDO_DIARIO.audioUrl);
        let isPlaying = false;

        const playBtn = document.getElementById('play-pause');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const visualizer = document.getElementById('visualizer-wrapper');
        const ctaContainer = document.getElementById('cta-container');

        audio.addEventListener('loadedmetadata', () => {
            const mins = Math.floor(audio.duration / 60);
            const secs = Math.floor(audio.duration % 60);
            totalTimeEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        });

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playIcon.classList.replace('fa-pause', 'fa-play');
                playIcon.style.marginLeft = '5px'; 
                visualizer.classList.remove('playing');
            } else {
                audio.play();
                playIcon.classList.replace('fa-play', 'fa-pause');
                playIcon.style.marginLeft = '0px'; 
                visualizer.classList.add('playing');
            }
            isPlaying = !isPlaying;
        });

        audio.addEventListener('timeupdate', () => {
            if(isNaN(audio.duration)) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            currentTimeEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        });

        document.getElementById('progress-container').addEventListener('click', (e) => {
            if(isNaN(audio.duration)) return;
            const width = e.currentTarget.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            playIcon.classList.replace('fa-pause', 'fa-play');
            playIcon.style.marginLeft = '5px';
            visualizer.classList.remove('playing');
            
            ctaContainer.classList.add('show');
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        });

        const shareBtn = document.getElementById('dom-share-link');
        const shareIcon = document.getElementById('share-icon');
        const shareText = document.getElementById('share-text');

        shareBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(CONTEUDO_DIARIO.linkParaCopiar);
                
                const originalText = shareText.innerText;
                const originalIcon = shareIcon.className;
                
                shareBtn.style.background = '#111111';
                shareBtn.style.color = '#FFFFFF';
                shareIcon.className = 'fas fa-check';
                shareText.innerText = 'Link Copiado!';
                
                setTimeout(() => {
                    shareBtn.style.background = '#25D366';
                    shareBtn.style.color = '#111111';
                    shareIcon.className = originalIcon;
                    shareText.innerText = originalText;
                }, 3000);

            } catch (err) {
                alert("Não foi possível copiar o link. Tente novamente.");
            }
        });

    </script>
</body>
</html>
