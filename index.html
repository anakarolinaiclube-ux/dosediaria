<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ícones DDM - Dose Diária de Motivação</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #E5DDD5; /* Fundo do seu site para simular o contraste */
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: multiply;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            padding: 40px;
            justify-content: center;
        }

        .card {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        /* Base para todos os Ícones */
        .app-icon {
            width: 90px;
            height: 90px;
            background: #111111; /* Fundo Preto */
            border-radius: 22px; /* Curvatura de App (iOS style) */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            color: #FFFFFF;
        }

        /* =========================================
           OPÇÃO 1: O Pedido Oficial (Raio no Fundo)
        ========================================= */
        .icon-v1 .emoji-bg {
            position: absolute;
            font-size: 4rem;
            opacity: 0.25; /* Translúcido para ficar no fundo */
            z-index: 1;
            transform: rotate(-10deg);
        }
        .icon-v1 .text {
            position: relative;
            z-index: 2;
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: -1px;
        }
        .icon-v1 .text span { color: #E50914; } /* M vermelho */

        /* =========================================
           OPÇÃO 2: Energia Vermelha (Corte Dinâmico)
           Tem uma faixa vermelha passando atrás
        ========================================= */
        .icon-v2 .slash {
            position: absolute;
            width: 150%;
            height: 40%;
            background: #E50914;
            transform: rotate(-35deg);
            z-index: 1;
        }
        .icon-v2 .text {
            position: relative;
            z-index: 2;
            font-weight: 900;
            font-size: 2.3rem;
            letter-spacing: -2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5); /* Sombra para destacar do fundo */
        }

        /* =========================================
           OPÇÃO 3: Fundo de Ondas Sonoras
           Ondas vermelhas bem discretas ao fundo
        ========================================= */
        .icon-v3 .waves-bg {
            position: absolute;
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }
        .icon-v3 .bar { width: 6px; background: #E50914; border-radius: 3px; }
        .icon-v3 .bar:nth-child(1) { height: 30%; }
        .icon-v3 .bar:nth-child(2) { height: 70%; }
        .icon-v3 .bar:nth-child(3) { height: 100%; }
        .icon-v3 .bar:nth-child(4) { height: 50%; }
        .icon-v3 .bar:nth-child(5) { height: 80%; }
        
        .icon-v3 .text {
            position: relative;
            z-index: 2;
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: -1.5px;
        }

        /* =========================================
           OPÇÃO 4: Minimalista com Ponto Verde
           Lembra a gravação de áudio do WhatsApp
        ========================================= */
        .icon-v4 .text {
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .icon-v4 .text span { color: #E50914; }
        .icon-v4 .mic-dot {
            width: 10px;
            height: 10px;
            background: #25D366; /* Verde WhatsApp */
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(37, 211, 102, 0.6);
            animation: rec-pulse 1.5s infinite alternate;
        }
        @keyframes rec-pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* =========================================
           OPÇÃO 5: Contorno Vazio (Outline Moderno)
           "DD" contornado em branco, "M" sólido vermelho
        ========================================= */
        .icon-v5 .text {
            font-weight: 900;
            font-size: 2.4rem;
            letter-spacing: -1px;
            display: flex;
        }
        .icon-v5 .outline {
            color: transparent;
            -webkit-text-stroke: 1.5px #FFFFFF;
        }
        .icon-v5 .solid {
            color: #E50914;
        }

        /* =========================================
           OPÇÃO 6: Glow Vermelho (Brilho Neon)
           Fundo preto, mas a caixa "acende" em vermelho
        ========================================= */
        .app-icon.icon-v6 {
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.4); /* Efeito Neon */
            border: 1px solid rgba(229, 9, 20, 0.3);
        }
        .icon-v6 .text {
            font-weight: 900;
            font-size: 2.4rem;
            letter-spacing: -2px;
        }
        .icon-v6 .text span { color: #E50914; }

    </style>
</head>
<body>

    <!-- OPÇÃO 1 -->
    <div class="card">
        <div class="card-title">Opção 1: Raio no Fundo</div>
        <div class="app-icon icon-v1">
            <div class="emoji-bg">⚡</div>
            <div class="text">DD<span>M</span></div>
        </div>
    </div>

    <!-- OPÇÃO 2 -->
    <div class="card">
        <div class="card-title">Opção 2: Energia em Corte</div>
        <div class="app-icon icon-v2">
            <div class="slash"></div>
            <div class="text">DDM</div>
        </div>
    </div>

    <!-- OPÇÃO 3 -->
    <div class="card">
        <div class="card-title">Opção 3: Áudio Oculto</div>
        <div class="app-icon icon-v3">
            <div class="waves-bg">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div class="text">DDM</div>
        </div>
    </div>

    <!-- OPÇÃO 4 -->
    <div class="card">
        <div class="card-title">Opção 4: Ponto de Gravação (Verde)</div>
        <div class="app-icon icon-v4">
            <div class="text">DD<span>M</span> <div class="mic-dot"></div></div>
        </div>
    </div>

    <!-- OPÇÃO 5 -->
    <div class="card">
        <div class="card-title">Opção 5: Contorno Moderno</div>
        <div class="app-icon icon-v5">
            <div class="text">
                <span class="outline">DD</span><span class="solid">M</span>
            </div>
        </div>
    </div>

    <!-- OPÇÃO 6 -->
    <div class="card">
        <div class="card-title">Opção 6: Glow Ignite</div>
        <div class="app-icon icon-v6">
            <div class="text">DD<span>M</span></div>
        </div>
    </div>

</body>
</html>
