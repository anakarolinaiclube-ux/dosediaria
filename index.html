<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ignite - Histórias que Mudam o Jogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* --- PALETA ATUALIZADA: FUNDO WHATSAPP --- */
            --bg-body: #E5DDD5; /* Bege clássico do fundo do WhatsApp */
            --bg-card: #FFFFFF; /* Cartões brancos estilo "balão de mensagem" */
            --bg-dark: #111111; /* Topo escuro mantido para a identidade Ignite */
            --accent-red: #E50914; 
            --accent-hover: #ff1f2a;
            
            /* Textos escuros para dar leitura no fundo claro */
            --text-main: #111111; 
            --text-light: #667781; /* Cinza oficial do texto secundário do WhatsApp */
            --border-color: #D1D7DB; /* Borda sutil estilo WhatsApp */
            --radius-lg: 24px;

            /* 
            DICA: Se você preferir o fundo do WhatsApp MODO ESCURO, troque as variáveis acima por:
            --bg-body: #0B141A;
            --bg-card: #111B21;
            --text-main: #E9EDEF;
            --text-light: #8696A0;
            --border-color: #222D34;
            */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            
            /* Aplicando a cor e a textura de rabiscos (doodles) do WhatsApp */
            background-color: var(--bg-body);
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            background-attachment: fixed;
            
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
        }

        /* --- CABEÇALHO --- */
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: #FFFFFF; /* Força o texto branco no topo escuro */
            flex-shrink: 0; 
        }
        .logo { font-weight: 800; letter-spacing: -1px; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { color: var(--accent-red); font-weight: 800; }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
        }

        .screen {
            width: 100%;
            max-width: 420px;
            text-align: center;
            margin: auto; 
        }

        /* --- CONTEÚDO DINÂMICO --- */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(229, 9, 20, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(229, 9, 20, 0.3);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        h1 { font-size: 1.5rem; margin-bottom: 12px; line-height: 1.3; font-weight: 800; }
        .desc { color: var(--text-light); margin-bottom: 30px; font-size: 0.95rem; line-height: 1.5; }

        /* --- VISUALIZADOR ECG (Eletrocardiograma) --- */
        .visualizer {
            width: 160px;
            height: 160px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .visualizer.playing {
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 0 40px rgba(229, 9, 20, 0.15);
        }

        .visualizer::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--accent-red);
            border-radius: 50%;
            opacity: 0;
        }

        .visualizer.playing::before {
            animation: pulse-red 1.5s infinite ease-out;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Linha SVG de Batimento */
        .ecg-svg { width: 90px; height: auto; }
        .ecg-path {
            fill: none;
            stroke: var(--accent-red);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
        }

        .visualizer.playing .ecg-path {
            animation: dash 3s linear infinite;
        }

        @keyframes dash {
            0% { stroke-dashoffset: 1000; }
            50% { stroke-dashoffset: 500; }
            100% { stroke-dashoffset: 0; }
        }

        /* --- PLAYER CONTROLS --- */
        .player-controls {
            background: var(--bg-card);
            padding: 25px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #EBEBEB; /* Ajustado para dar contraste no cartão branco */
            border-radius: 3px;
            margin-bottom: 15px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-red);
            border-radius: 3px;
            position: relative;
            transition: width 0.1s linear;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .play-btn {
            width: 65px;
            height: 65px;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.2);
        }
        .play-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
        .play-btn:active { transform: scale(0.95); }

        /* --- BOTÃO DE COMPARTILHAMENTO (CTA) --- */
        .cta-container {
            display: none; 
            animation: slideUp 0.5s ease forwards;
            margin-top: 15px;
        }

        .cta-container.show {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-share {
            display: block;
            width: 100%;
            padding: 16px;
            background: #25D366; 
            color: #111;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
        }
        .btn-share i { margin-right: 8px; font-size: 1.2rem; }
        .btn-share:hover { background: #20b858; }
        .btn-share:active { transform: scale(0.98); }

        footer { padding: 20px; text-align: center; font-size: 0.7rem; color: var(--text-light); flex-shrink: 0; }

    </style>
</head>
<body>

    <header>
        <div class="logo">IGNITE<span>.</span></div>
    </header>

    <main class="app-container">
        
        <section id="experience-screen" class="screen">
            <!-- Os campos abaixo serão preenchidos via JavaScript -->
            <span class="badge" id="dom-season">Carregando...</span>
            <h1 id="dom-episode">...</h1>
            <p class="desc" id="dom-context">...</p>

            <div class="visualizer" id="visualizer-wrapper">
                <!-- Gráfico de ECG em SVG -->
                <svg class="ecg-svg" viewBox="0 0 150 50">
                    <polyline class="ecg-path" points="0,25 30,25 40,10 55,45 70,5 85,35 95,25 150,25" />
                </svg>
            </div>

            <div class="player-controls">
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="time-info">
                    <span id="current-time">00:00</span>
                    <span id="total-time">00:00</span>
                </div>
                <button class="play-btn" id="play-pause">
                    <i class="fas fa-play" id="play-icon" style="margin-left: 5px;"></i>
                </button>
            </div>

            <!-- Botão CTA que aparece no final -->
            <div id="cta-container" class="cta-container">
                <a href="#" id="dom-share-link" class="btn-share" target="_blank">
                    <i class="fab fa-whatsapp"></i> Compartilhar Inspiração
                </a>
            </div>

        </section>

    </main>

    <footer>
        &copy; 2026 Ignite. Histórias de Alto Impacto.
    </footer>

    <script>
        // ==========================================
        // ÁREA DE EDIÇÃO DIÁRIA (Altere os valores aqui)
        // ==========================================
        const CONTEUDO_DIARIO = {
            temporada: "Temporada 1: Lendas do Esporte",
            episodio: "Ep 01: A Obsessão de Kobe Bryant",
            contexto: "Descubra como uma decisão tomada às 4h da manhã forjou a mentalidade de um dos maiores atletas da história.",
            
            // Link do áudio do dia (formato .mp3)
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", 
            
            // Link que o botão vai abrir ao final
            linkCompartilhamento: "https://wa.me/?text=Acabei%20de%20ouvir%20o%20Episódio%20sobre%20Kobe%20Bryant%20no%20Ignite!%20Ouça%20também:%20[‎https://whatsapp.com/channel/0029VaLBvo14yltKMlZTK008]"
        };
        // ==========================================
        // FIM DA ÁREA DE EDIÇÃO DIÁRIA
        // ==========================================

        document.getElementById('dom-season').innerText = CONTEUDO_DIARIO.temporada;
        document.getElementById('dom-episode').innerText = CONTEUDO_DIARIO.episodio;
        document.getElementById('dom-context').innerText = CONTEUDO_DIARIO.contexto;
        document.getElementById('dom-share-link').href = CONTEUDO_DIARIO.linkCompartilhamento;

        const audio = new Audio(CONTEUDO_DIARIO.audioUrl);
        let isPlaying = false;

        const playBtn = document.getElementById('play-pause');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const visualizer = document.getElementById('visualizer-wrapper');
        const ctaContainer = document.getElementById('cta-container');

        audio.addEventListener('loadedmetadata', () => {
            const mins = Math.floor(audio.duration / 60);
            const secs = Math.floor(audio.duration % 60);
            totalTimeEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        });

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playIcon.classList.replace('fa-pause', 'fa-play');
                playIcon.style.marginLeft = '5px'; 
                visualizer.classList.remove('playing');
            } else {
                audio.play();
                playIcon.classList.replace('fa-play', 'fa-pause');
                playIcon.style.marginLeft = '0px'; 
                visualizer.classList.add('playing');
            }
            isPlaying = !isPlaying;
        });

        audio.addEventListener('timeupdate', () => {
            if(isNaN(audio.duration)) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${percent}%`;
            
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            currentTimeEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        });

        document.getElementById('progress-container').addEventListener('click', (e) => {
            if(isNaN(audio.duration)) return;
            const width = e.currentTarget.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            playIcon.classList.replace('fa-pause', 'fa-play');
            playIcon.style.marginLeft = '5px';
            visualizer.classList.remove('playing');
            
            ctaContainer.classList.add('show');
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        });

    </script>
</body>
</html>
